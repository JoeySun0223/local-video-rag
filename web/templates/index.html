<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>本地视频知识库</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header><h1>本地视频知识库</h1><p>本地检索、本地模型、可追溯视频来源</p></header>
  <main>
    <section class="panel ask-panel">
      <div class="row"><input id="query" placeholder="输入你想了解的问题"><button id="ask">提问</button></div>
      <label class="inline"><input id="log-query" type="checkbox" checked> 将本次问题保存在本机（默认保留90天）</label>
      <div id="status" class="muted"></div>
      <article id="answer"></article>
      <div id="sources" class="cards"></div>
    </section>
    <aside class="panel">
      <h2>导入视频</h2>
      <form id="ingest-form">
        <label>分类（可选）<input name="category" placeholder="默认：未分类"></label>
        <label>标题<input name="title" placeholder="默认使用文件名"></label>
        <label>视频<input name="video" type="file" accept="video/*,audio/*" required></label>
        <button type="submit">开始入库</button>
        <button id="continue-task" type="button" hidden>确认并运行完整ASR</button>
        <button id="cancel-task" type="button" class="secondary" hidden>安全取消</button>
        <button id="retry-task" type="button" class="secondary" hidden>复用上传与ASR检查点重试</button>
      </form>
      <section id="task-panel" class="ingest-progress" hidden>
        <div class="progress-heading"><strong id="task-stage">等待开始</strong><span id="task-percent">0%</span></div>
        <progress id="task-progress" max="100" value="0"></progress>
        <div id="task-message" class="muted"></div>
        <div id="task-result"></div>
        <details id="task-storage-panel" hidden>
          <summary>各类数据保存位置</summary>
          <div id="task-storage" class="storage-list"></div>
        </details>
      </section>
      <h2>已入库来源</h2>
      <div id="library"></div>
      <h2>术语纠错候选</h2>
      <p class="meta">Qwen不会逐句改写。人工受控词表中的映射会保留原始ASR，并生成校订文本；空词表表示尚无已批准映射。</p>
      <div id="corrections"></div>
      <h2>本机查询日志</h2>
      <div class="row"><a class="button-link" href="/api/query-logs/export">导出</a><button id="clear-logs" class="secondary" type="button">清空</button></div>
      <div id="logs" class="compact-list"></div>
    </aside>
  </main>
  <dialog id="player-dialog"><button id="close-player">关闭</button><h3 id="player-title"></h3><video id="player" controls preload="metadata"></video></dialog>
  <dialog id="inspect-dialog"><button id="close-inspect">关闭</button><h2 id="inspect-title">数据检查</h2><div id="inspect-body"></div></dialog>
  <dialog id="edit-review-dialog">
    <button id="close-edit-review" class="secondary">返回继续修改</button>
    <h2>确认逐句校订</h2>
    <p class="meta">下面列出全部修改。术语候选默认不勾选；只有可在该来源中安全重复替换的错词才应加入术语表。</p>
    <div id="edit-review-body"></div>
    <button id="apply-sentence-edits" type="button">一键修改并同步全部资产</button>
  </dialog>
  <script src="/static/app.js"></script>
</body>
</html>
